# RSF - SysEntrega — orquestração em Docker
#
# Tudo numa máquina:        docker compose --profile app --profile dados up -d --build
# Só a aplicação:           docker compose --profile app up -d --build   (banco em outro servidor: ajuste DATABASE_URL)
# Só o banco:               docker compose --profile dados up -d
#
# Copie .env.example para .env e ajuste antes de subir.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["dados"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sysentrega}
      POSTGRES_USER: ${POSTGRES_USER:-sysentrega}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      # Por padrão só a própria máquina alcança o banco. Em deploy separado,
      # defina BIND_IP com o IP da rede privada entre os servidores.
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sysentrega}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sysentrega:${POSTGRES_PASSWORD:-}@postgres:5432/sysentrega?schema=public}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRA_EM: ${JWT_EXPIRA_EM:-10h}
      PORT: "3000"
      APP_URL: ${APP_URL:-http://localhost}
      PROXIES_CONFIAVEIS: ${PROXIES_CONFIAVEIS:-1}
      FUSO_HORARIO: ${FUSO_HORARIO:-America/Sao_Paulo}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@sysentrega.local}
      SEED_SENHA_PADRAO: ${SEED_SENHA_PADRAO:-}
      SEED_DEMO: ${SEED_DEMO:-}
      AGENDAMENTO_MIN_OPCOES: ${AGENDAMENTO_MIN_OPCOES:-1}
      # Assinatura: interno (padrão) ou rsf-signer
      ASSINATURA_PROVEDOR: ${ASSINATURA_PROVEDOR:-interno}
      RSF_SIGNER_URL: ${RSF_SIGNER_URL:-}
      RSF_SIGNER_API_KEY: ${RSF_SIGNER_API_KEY:-}
      RSF_SIGNER_WEBHOOK_SECRET: ${RSF_SIGNER_WEBHOOK_SECRET:-}
      # Código de uso único do cliente (assinatura interna)
      CODIGO_MINUTOS: ${CODIGO_MINUTOS:-15}
      CODIGO_TENTATIVAS: ${CODIGO_TENTATIVAS:-5}
      CODIGO_NO_LOG: ${CODIGO_NO_LOG:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - dados_arquivos:/dados/armazenamento
    # Sem porta publicada: quem fala com a API é o nginx do frontend
    expose:
      - "3000"

  frontend:
    build: ./frontend
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  dados_postgres:
  dados_arquivos:
